<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ college_name }} – Campus Placement Registration Portal">
    <title>{% block title %}Placement Surge Portal{% endblock %} – {{ college_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header class="site-header">
        <div class="site-nav-container">
            <a href="/" class="site-brand">
                <span class="brand-title">{{ college_name }}</span>
            </a>
            <nav class="site-nav" aria-label="Main Navigation">
                <ul class="nav-links">
                    <li>
                        <a href="/" class="nav-link{% if active_page == 'portal' %} active{% endif %}"{% if active_page == 'portal' %} aria-current="page"{% endif %}>Drives</a>
                    </li>
                    <li>
                        <a href="/ops" class="nav-link{% if active_page == 'ops' %} active{% endif %}"{% if active_page == 'ops' %} aria-current="page"{% endif %}>Control room</a>
                    </li>
                    <li>
                        <a href="/about" class="nav-link{% if active_page == 'about' %} active{% endif %}"{% if active_page == 'about' %} aria-current="page"{% endif %}>About</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
